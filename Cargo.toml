[package]
name = "bayesfm"
version = "0.1.0"
authors = ["Andreas J. Weiss <ajefweiss@gmail.com>"]
edition = "2024"
license = "MIT License"
repository = "https://github.com/ajefweiss/ocnus/"
rust-version = "1.92"

[dependencies]
approx = "0.5.1"
chrono = "0.4.45"
criterion = "0.8.2"
derive_builder = "0.20.2"
derive_more = { version = "2.1.1", features = ["full"] }
dtw = "0.1.0"
env_logger = "0.11.11"
itertools = "0.15.0"
log = "0.4.33"
nalgebra = { version = "0.34.2", features = ["rayon", "serde-serialize"] }
num-traits = "0.2.19"
numpy = { version = "0.29.0", features = ["nalgebra"], optional = true }
paste = { version = "1.0.15", optional = true }
pyo3 = { version = "0.29.2", features = ["multiple-pymethods", "extension-module"], optional = true }
rand = "0.10.1"
rand_distr = "0.6.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_arrays = "0.2.0"
serde_json5 = "0.2.1"
typenum = "1.20.1"
thiserror = "2.0.18"
wcs = { path = "../wcs-rs" }

prodef = { path = "../prodef-rs" }

[features]
pyo3 = ["dep:numpy", "dep:paste", "dep:pyo3"]
pyo3_f32 = ["pyo3"]

[profile.bench]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3

[profile.test]
opt-level = 1

[lints.rust]
missing_docs = "deny"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
